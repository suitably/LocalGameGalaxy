include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# -- Quality Gate Stage (Mirrors GitHub CI Quality Gate) --
ci_quality_gates:
  stage: test
  script:
    - npm run ci:gates

server_tests:
  stage: test
  script:
    - cd server && npm ci --cache ../.npm --prefer-offline && npm run build && npm test

docs_sync_check:
  stage: test
  script:
    - npm run check:docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -- Build Stage --
build_app:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  needs: ["ci_quality_gates", "server_tests"]
