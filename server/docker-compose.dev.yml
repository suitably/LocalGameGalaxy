services:
  nexumia-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    container_name: nexumia-server-dev
    restart: "no"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./config.json:/app/config.json:z
      - ./models:/app/models:z
      - ./src:/app/src:z
      - ./public:/app/public:z
      - ./index.js:/app/index.js:z
      # Mount your local music directories here (writable with :z for stem saving and sync)
      - /home/deck/Music/Ultrastar/Songs:/music/songs:z
      - /home/deck/Music/Ultrastar/Test:/music/test:z
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=

