services:
  nexumia-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: nexumia-server-dev
    restart: "no"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./config.json:/app/config.json:z
      - ./models:/app/models:z
      # Mount your local music directories here (read-only).
      # Add as many as needed.
      - /home/deck/Music/Ultrastar/Songs:/music/songs:ro
      - /home/deck/Music/Ultrastar/Test:/music/test:ro
    environment:
      - NODE_ENV=development
      # Empty = allow ALL origins (open CORS for local dev)
      - ALLOWED_ORIGINS=

