services:
  melodiq-server:
    image: nexumia/melodiq-server:latest
    container_name: melodiq-server
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json:z
      # Pass your music library directories here. 
      # You can add multiple volumes if you have songs in different locations.
      # Example: - /home/user/Music:/music:ro
    environment:
      - NODE_ENV=production
      # Comma-separated list of allowed origins for CORS.
      # Remove or leave empty to allow ALL origins (open mode).
      - ALLOWED_ORIGINS=https://nexumia.de,https://www.nexumia.de
