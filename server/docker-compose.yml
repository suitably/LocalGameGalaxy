services:
  # ══════════════════════════════════════════════════════════════════
  # 1. Platform Infrastructure (WebRTC Signaling for all games)
  # ══════════════════════════════════════════════════════════════════
  signaling:
    image: nexumia/galaxy-signaling:latest
    container_name: galaxy-signaling
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ══════════════════════════════════════════════════════════════════
  # 2. Game Companion Services (Modular Plugins)
  # ══════════════════════════════════════════════════════════════════

  # Nexumia server (formerly melodiq-server): one container, plugins relay + melodiq + tabletop + notes (PLUGINS, default all).
  # Each plugin keeps its data in its own folder; drop a plugin from PLUGINS and its volume line.
  # Push notifications need no container (ntfy or server/cloudflare-push-relay worker).
  nexumia-server:
    image: nexumia/nexumia-server:latest
    container_name: nexumia-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./config:/app/config
      - ./music:/app/music # melodiq: UltraStar song library
      - ./models:/app/models # melodiq: AI models (stems, Whisper)
      - ./tabletop:/app/tabletop # tabletop: game library, saved games in tabletop/saved/
      - ./notes:/app/notes # notes: Melodiq Notes scores, recordings, bar marks
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PLUGINS=relay,melodiq,tabletop,notes
      - MUSIC_DIR=/app/music
      - TABLETOP_DIR=/app/tabletop
      - NOTES_DIR=/app/notes
      - CONFIG_PATH=/app/config/config.json
      - SECURITY_TOKEN= # Auto-generated and persisted if empty
      - ENABLE_TUNNEL=false # Set to 'true' for Cloudflare Quick Tunnel
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Optional Cloudflare Quick Tunnel for the Nexumia server (docker compose --profile tunnel up -d)
  nexumia-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nexumia-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://nexumia-server:3000
    depends_on:
      - nexumia-server
