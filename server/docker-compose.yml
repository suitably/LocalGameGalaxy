services:
  nexumia-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: nexumia/nexumia-server:latest
    container_name: nexumia-server
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./config.json:/app/config.json:z
      - ./models:/app/models:z
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://nexumia.de,https://www.nexumia.de

  nexumia-server-full:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    image: nexumia/nexumia-server:full
    container_name: nexumia-server
    restart: always
    profiles:
      - melodiq
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./config.json:/app/config.json:z
      - ./models:/app/models:z
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://nexumia.de,https://www.nexumia.de
