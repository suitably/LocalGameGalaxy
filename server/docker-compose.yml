services:
  # 1. Galaxy Core Backend (Lightweight Micro-Kernel: Relay, Signaling & Media)
  galaxy-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: localgamegalaxy/server:latest
    container_name: galaxy-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./music:/app/music:ro
      - ./config.json:/app/config.json:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PLUGINS=relay,melodiq
      - ALLOWED_ORIGINS=*

  # 2. Zero-Config Public HTTPS Tunnel (Share with friends without port-forwarding)
  galaxy-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: galaxy-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://galaxy-server:3000
    depends_on:
      - galaxy-server

  # 3. Melodiq Heavy AI Sidecar (Stem separation & Whisper lyrics alignment)
  galaxy-ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    image: localgamegalaxy/server:ai
    container_name: galaxy-ai-worker
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ./models:/app/models:z
      - ./music:/app/music:z
    environment:
      - NODE_ENV=production
