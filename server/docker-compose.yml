services:
  # Melodiq Companion Server (Karaoke Media Streaming, USDB & AI Vocal Separation)
  # Standard (~200MB): nexumia/melodiq-server:latest
  # With AI Vocal Separation & Whisper: nexumia/melodiq-server:ai (or :melodiq)
  melodiq-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: nexumia/melodiq-server:latest
    container_name: melodiq-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./music:/app/music:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SECURITY_TOKEN=
      - MUSIC_DIR=/app/music
      - ALLOWED_ORIGINS=*

  # Optional: Zero-Config Public HTTPS Tunnel (Share with friends without port-forwarding)
  melodiq-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: melodiq-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://melodiq-server:3000
    depends_on:
      - melodiq-server
