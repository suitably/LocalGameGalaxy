services:
  # ══════════════════════════════════════════════════════════════════
  # 1. Platform Infrastructure (WebRTC Signaling for all games)
  # ══════════════════════════════════════════════════════════════════
  signaling:
    image: nexumia/galaxy-signaling:latest
    container_name: galaxy-signaling
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ══════════════════════════════════════════════════════════════════
  # 2. Game Companion Services (Modular Plugins)
  # ══════════════════════════════════════════════════════════════════

  # MelodiQ Karaoke Companion (AI stem separation, Whisper alignment, streaming)
  melodiq:
    image: nexumia/melodiq-server:latest
    container_name: melodiq-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./music:/app/music
      - ./config:/app/config
      - ./models:/app/models
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MUSIC_DIR=/app/music
      - CONFIG_PATH=/app/config/config.json
      - SECURITY_TOKEN=             # Auto-generated and persisted if empty
      - ENABLE_TUNNEL=false         # Set to 'true' for Cloudflare Quick Tunnel
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Optional Cloudflare Quick Tunnel for MelodiQ (docker compose --profile tunnel up -d)
  melodiq-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: melodiq-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://melodiq:3000
    depends_on:
      - melodiq

  # Example future companion plugin: Tabletop asset & deck server
