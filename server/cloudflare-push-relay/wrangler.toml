name = "galaxy-push-relay"
main = "worker.ts"
compatibility_date = "2024-01-01"

[vars]
VAPID_SUBJECT = "https://github.com/suitably/LocalGameGalaxy"

# ─── VAPID Keys ───────────────────────────────────────────────────────────────
# Web Push needs a key pair of its own per deployment, never one from the repository.
# Either set both as Worker Secrets (recommended):
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#
# Generate a VAPID keypair with:
#   npx web-push generate-vapid-keys
# The public key is the 65-byte uncompressed EC P-256 key (base64url).
# The private key is the 32-byte raw key (base64url).
#
# Or bind PUSH_KV (below): the worker then generates a pair once and keeps it there.
# Without secrets and without KV, Web Push is off and only ntfy is delivered.

# ─── KV Namespace (Recommended for Production) ───────────────────────────────
# Enables persistent push subscription storage across worker restarts and regions.
# Without KV, subscriptions are held in-memory only and lost on redeploy.
#
# To create and bind a KV namespace:
#   npx wrangler kv namespace create PUSH_KV
# Then paste the generated binding below:
#
# [[kv_namespaces]]
# binding = "PUSH_KV"
# id = "<your-kv-namespace-id>"
