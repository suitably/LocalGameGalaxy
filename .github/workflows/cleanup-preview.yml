name: Cleanup Cloudflare Preview

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      delete_all:
        description: 'Delete all preview deployments/branches in Cloudflare'
        type: boolean
        default: true
      branch_name:
        description: 'Specific branch name to delete (optional)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run Cloudflare Preview Cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name || github.event.pull_request.head.ref }}
          DELETE_ALL: ${{ github.event.inputs.delete_all || 'false' }}
        run: node scripts/cleanup-cloudflare-previews.mjs

      - name: Update PR Deployment Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const handlePreviewComment = require('./scripts/pipeline/preview-comment.cjs');
            await handlePreviewComment({ github, context, core }, { status: 'cleaned-up' });
