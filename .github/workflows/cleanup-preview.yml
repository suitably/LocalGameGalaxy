name: Cleanup Cloudflare Preview

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      delete_all:
        description: 'Delete all preview deployments/branches in Cloudflare'
        type: boolean
        default: true
      branch_name:
        description: 'Specific branch name to delete (optional)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run Cloudflare Preview Cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name || github.event.pull_request.head.ref }}
          DELETE_ALL: ${{ github.event.inputs.delete_all || 'false' }}
        run: node scripts/cleanup-cloudflare-previews.mjs

      - name: Update PR Deployment Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref || '';
            const prNumber = context.payload.pull_request.number;
            const commentHeader = '### 🚀 Cloudflare Preview Deployment';
            const merged = context.payload.pull_request.merged;
            const statusText = merged ? 'Merged & Cleaned Up' : 'Closed & Cleaned Up';
            const body = `${commentHeader}\n\n🧹 **Status: ${statusText}**\nThe Cloudflare preview environment for branch \`${branch}\` has been deleted.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 50
              });

              const existingComment = comments.find(c => c.body?.includes(commentHeader));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body
                });
              }
            } catch (err) {
              console.warn('Could not update PR comment:', err.message);
            }
