name: Jules Issue Auto-Fix Pipeline

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue Number to resolve'
        required: true
        type: number
      mode:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - fix
          - curate
          - curate-all

concurrency:
  group: jules-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event_name == 'issue_comment' && 'comment' || 'pipeline' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Determine Trigger & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.decide.outputs.action }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      is_authorized: ${{ steps.decide.outputs.is_authorized }}
      lens_name: ${{ steps.decide.outputs.lens_name }}
      targets: ${{ steps.decide.outputs.targets }}
    steps:
      - name: Evaluate command and permissions
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let action = 'skip';
            let issueNumber = null;
            let isAuthorized = false;
            let lensName = '';
            let targets = '';

            // Security check: Only allow repo owner, members, or collaborators
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            if (eventName === 'workflow_dispatch') {
              action = context.payload.inputs.mode;
              issueNumber = context.payload.inputs.issue_number;
              isAuthorized = true; // workflow_dispatch already requires repository write access
            } else if (eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const issue = context.payload.issue;

              // Do not run on Pull Requests, only standalone Issues
              if (!issue.pull_request) {
                issueNumber = issue.number;
                const authorAssoc = comment.author_association;
                isAuthorized = trustedRoles.includes(authorAssoc);

                const rawBody = (comment.body || '').trim();
                const body = rawBody.toLowerCase();

                if (body.startsWith('/bundle')) {
                  action = 'bundle';
                  const matches = rawBody.match(/#?(\d+)/g) || [];
                  targets = matches.map(m => m.replace('#', '')).filter(m => m !== String(issueNumber)).join(',');
                } else if (body.startsWith('/duplicate')) {
                  action = 'duplicate';
                  const match = rawBody.match(/#?(\d+)/);
                  if (match) targets = match[1];
                } else if (body.startsWith('/curate-all') || body.startsWith('/triage-all')) {
                  action = 'curate-all';
                } else if (body.startsWith('/curate') || body.startsWith('/triage') || body.startsWith('/check') || body.startsWith('/dedup')) {
                  action = 'curate';
                } else if (body.startsWith('/jules lens')) {
                  action = 'fix';
                  const parts = body.split(/\s+/);
                  if (parts.length > 2) {
                    lensName = parts[2].trim();
                  }
                } else if (body.startsWith('/jules reply') || body.startsWith('/reply')) {
                  action = 'reply';
                  const replyText = rawBody.replace(/^\/(jules\s+)?reply\s*/i, '').trim();
                  targets = replyText || 'Please proceed autonomously with the proposed solution and create the pull request.';
                } else if (body.startsWith('/continue') || body.startsWith('/jules continue')) {
                  action = 'reply';
                  const replyText = rawBody.replace(/^\/(jules\s+)?continue\s*/i, '').trim();
                  targets = replyText || 'Please proceed autonomously with your proposed approach, implement the solution, run tests and create the pull request without asking further questions.';
                } else if (body.startsWith('/approve-plan') || body.startsWith('/jules approve-plan')) {
                  action = 'approve-plan';
                } else if (body.startsWith('/status') || body.startsWith('/jules status')) {
                  action = 'status';
                } else if (body.startsWith('/jules plan') || body.startsWith('/plan')) {
                  action = 'plan';
                } else if (body.startsWith('/jules approve') || body.startsWith('/approve') || body.startsWith('/jules fix') || body.startsWith('/fix')) {
                  action = 'fix';
                }
              }
            } else if (eventName === 'issues' && context.payload.action === 'opened') {
              const issue = context.payload.issue;
              if (!issue.pull_request) {
                issueNumber = issue.number;
                isAuthorized = true;
                action = 'curate'; // Automatic triage on new issues
              }
            } else if (eventName === 'issues' && context.payload.action === 'labeled') {
              const labelName = context.payload.label.name.toLowerCase();
              const issue = context.payload.issue;
              const sender = context.payload.sender.login;

              if (!issue.pull_request) {
                issueNumber = issue.number;
                // Sender authorization check
                const authorAssoc = issue.author_association;
                isAuthorized = trustedRoles.includes(authorAssoc) || sender === context.repo.owner;

                if (labelName === 'curate' || labelName === 'triage' || labelName === 'jules:curate') {
                  action = 'curate';
                } else if (labelName === 'bundle' || labelName === 'auto-bundle' || labelName === 'bundle-related' || labelName === 'jules:bundle') {
                  action = 'auto-bundle';
                } else if (labelName === 'duplicate' || labelName === 'jules:duplicate') {
                  action = 'auto-duplicate';
                } else if (labelName.startsWith('lens:')) {
                  action = 'fix';
                  lensName = labelName.replace('lens:', '').trim();
                } else if (labelName === 'jules' || labelName === 'jules:plan' || labelName === 'plan' || labelName === 'game-factory') {
                  action = 'plan';
                } else if (labelName === 'jules:approved' || labelName === 'jules:fix' || labelName === 'approved' || labelName === 'fix' || labelName === 'approve') {
                  action = 'fix';
                }
              }
            }

            console.log({ action, issueNumber, isAuthorized, lensName, targets });
            core.setOutput('action', action);
            core.setOutput('issue_number', issueNumber);
            core.setOutput('is_authorized', isAuthorized ? 'true' : 'false');
            core.setOutput('lens_name', lensName);
            core.setOutput('targets', targets);

  curate-issue:
    name: Curate & Triage Issue
    needs: triage
    if: (needs.triage.outputs.action == 'curate' || needs.triage.outputs.action == 'auto-bundle' || needs.triage.outputs.action == 'bundle' || needs.triage.outputs.action == 'auto-duplicate' || needs.triage.outputs.action == 'duplicate' || needs.triage.outputs.action == 'curate-all') && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Issue Curator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          CURATOR_ACTION: ${{ needs.triage.outputs.action }}
          CURATOR_TARGETS: ${{ needs.triage.outputs.targets }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/issue-curator.mjs --issue "$ISSUE_NUMBER" --action "$CURATOR_ACTION" --targets "$CURATOR_TARGETS"

  generate-plan:
    name: Generate Implementation Plan
    needs: triage
    if: needs.triage.outputs.action == 'plan' && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve RepoLens Lens (if specified)
        id: lens_resolver
        if: needs.triage.outputs.lens_name != ''
        run: |
          node scripts/jules-lens-resolver.mjs --lens "${{ needs.triage.outputs.lens_name }}"

      - name: Run Plan Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          LENS_PROMPT: ${{ steps.lens_resolver.outputs.prompt }}
          LENS_NAME: ${{ steps.lens_resolver.outputs.lens_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/jules-plan-generator.mjs --issue ${{ needs.triage.outputs.issue_number }}

  execute-jules:
    name: Execute Task with Google Jules
    needs: triage
    if: needs.triage.outputs.action == 'fix' && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure dev branch exists on origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --heads origin dev | grep -q 'refs/heads/dev'; then
            echo "Branch 'dev' does not exist on origin. Creating 'dev' from 'main'..."
            git fetch origin main
            git push origin origin/main:refs/heads/dev
          else
            echo "Branch 'dev' already exists on origin."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve RepoLens Lens (if specified)
        id: lens_resolver
        if: needs.triage.outputs.lens_name != ''
        run: |
          node scripts/jules-lens-resolver.mjs --lens "${{ needs.triage.outputs.lens_name }}"

      - name: Fetch Issue Context & Prepare Prompt
        id: prep
        uses: actions/github-script@v7
        env:
          LENS_PROMPT: ${{ steps.lens_resolver.outputs.prompt }}
          LENS_NAME: ${{ steps.lens_resolver.outputs.lens_name }}
        with:
          script: |
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const lensPrompt = process.env.LENS_PROMPT || '';
            const lensName = process.env.LENS_NAME || '';

            // Post dispatch confirmation comment
            const dispatchMsg = lensName 
              ? `🤖 **Google Jules Dispatched with RepoLens (${lensName})**\n\nJules has been tasked with resolving this issue using the **${lensName}** lens on a branch based on \`dev\`.\nYou can monitor task progress on [jules.google.com](https://jules.google.com).\nA Pull Request targeting the \`dev\` branch will be opened once implementation and verification complete.`
              : `🤖 **Google Jules Dispatched**\n\nJules has been tasked with resolving this issue on a branch based on \`dev\`.\nYou can monitor task progress on [jules.google.com](https://jules.google.com).\nA Pull Request targeting the \`dev\` branch will be opened once implementation and verification complete.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: dispatchMsg
            });

            // Update labels
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'jules:waiting-approval'
              });
            } catch (e) {}

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['jules:in-progress']
              });
            } catch (e) {}

            // Fetch relevant user feedback from comments (exclude bots & slash commands)
            let commentsContext = '';
            try {
              const commentsRes = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 50
              });
              const filteredComments = (commentsRes.data || []).filter(c => {
                const author = c.user?.login || '';
                const body = (c.body || '').trim();
                const isBot = c.user?.type === 'Bot' || author.includes('[bot]') || author === 'github-actions' || body.startsWith('## 🤖') || body.startsWith('### 🔍') || body.startsWith('/');
                return !isBot && body.length > 0;
              });
              if (filteredComments.length > 0) {
                commentsContext = '\n\nUser Feedback & Clarifications from Issue Comments:\n' +
                  filteredComments.map(c => `- @${c.user?.login}: ${c.body.trim()}`).join('\n\n');
              }
            } catch (err) {
              console.warn('Could not fetch comments for Jules prompt:', err.message);
            }

            const prompt = `
            Task: Fix GitHub Issue #${issueNumber}: ${issue.data.title}

            CRITICAL EXECUTION MODE: FULLY AUTONOMOUS / HEADLESS CI AUTOMATION
            - DO NOT ASK FOR CONFIRMATION, APPROVAL, OR INTERMEDIATE FEEDBACK AT ANY POINT.
            - THERE IS NO HUMAN IN THE LOOP. Any question or confirmation request will permanently stall the automated pipeline.
            - YOU HAVE FULL PROACTIVE AUTHORITY: You are authorized and REQUIRED to make all implementation and architectural decisions autonomously.
            - If a component exceeds the 250-line limit or requires decomposition according to AGENTS.md (e.g. creating sub-components or custom hooks), IMMEDIATELY create and extract them yourself without asking for user permission.
            - Proceed continuously from planning to coding, running Vitest tests, verifying quality gates, and submitting the Pull Request against 'dev'. Never pause or wait for user input.

            Issue Description:
            ${issue.data.body || 'No description provided'}${commentsContext}

            ${lensPrompt ? `\nSPECIALIZED REPOLENS AUDIT FOCUS:\n${lensPrompt}\n` : ''}

            Target & Branch Instructions:
            - Your base branch is 'dev'.
            - When creating a pull request, TARGET THE 'dev' BRANCH (not 'main').
            - Reference 'Fixes #${issueNumber}' in the PR description.

            Mandatory Project Rules (from AGENTS.md):
            - Maximum 250 lines per .tsx component. Decompose larger components into hooks and sub-components.
            - No cross-game imports: src/games/<A> must never import from src/games/<B>.
            - Use src/lib/storage.ts for storage with STORAGE_KEYS. Never raw localStorage or sessionStorage.
            - Use MUI <Dialog> or <ConfirmDialog>. Never native window.confirm() or alert().
            - Strict TypeScript: no 'any'. Use discriminated unions.
            - Zero Code Duplication: Search src/modules/ and reuse existing code. 'npm run check:duplicates' will reject PRs with copy-paste clones.
            - Documentation & i18n Sync: Always update docs/tech/architecture.md and both public/locales/de and en translation files. 'npm run check:docs' enforces this.
            - Verify your work before concluding: run 'npm run check:architecture:diff', 'npm run check:duplicates', 'npm run check:budget', 'npm test', and 'npm run build'.
            `;

            core.setOutput('prompt', prompt);

      - name: Invoke Google Jules Agent
        id: jules_call
        env:
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          STARTING_BRANCH: 'dev'
          REPO: ${{ github.repository }}
          USER_PROMPT: ${{ steps.prep.outputs.prompt }}
        shell: bash
        run: |
          # 1. Collect all available Jules API keys from secrets
          declare -a KEYS=()
          declare -a KEY_NAMES=()

          if [ -n "$JULES_API_KEY_1" ]; then KEYS+=("$JULES_API_KEY_1"); KEY_NAMES+=("JULES_API_KEY_1"); fi
          if [ -n "$JULES_API_KEY_2" ]; then KEYS+=("$JULES_API_KEY_2"); KEY_NAMES+=("JULES_API_KEY_2"); fi
          if [ -n "$JULES_API_KEY_3" ]; then KEYS+=("$JULES_API_KEY_3"); KEY_NAMES+=("JULES_API_KEY_3"); fi
          if [ -n "$JULES_API_KEY_4" ]; then KEYS+=("$JULES_API_KEY_4"); KEY_NAMES+=("JULES_API_KEY_4"); fi
          if [ -n "$JULES_API_KEY_5" ]; then KEYS+=("$JULES_API_KEY_5"); KEY_NAMES+=("JULES_API_KEY_5"); fi

          # Fallback to JULES_API_KEY if none of the numbered keys exist
          if [ ${#KEYS[@]} -eq 0 ] && [ -n "$JULES_API_KEY" ]; then
            KEYS+=("$JULES_API_KEY")
            KEY_NAMES+=("JULES_API_KEY")
          fi

          TOTAL_KEYS=${#KEYS[@]}
          if [ "$TOTAL_KEYS" -eq 0 ]; then
            echo "error_msg=Kein JULES_API_KEY oder JULES_API_KEY_1..5 in den GitHub Repository Secrets hinterlegt." >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            echo "::error::No Jules API key secrets configured!"
            exit 1
          fi

          echo "Found $TOTAL_KEYS Jules API key(s) in pool: ${KEY_NAMES[*]}"

          # 2. Prepare payload
          echo "$USER_PROMPT" > prompt.txt

          jq -n \
            --rawfile jules_prompt prompt.txt \
            --arg starting_branch "$STARTING_BRANCH" \
            --arg repo_full_name "$REPO" \
            '{
              "prompt": $jules_prompt,
              "sourceContext": {
                "source": "sources/github/\($repo_full_name)",
                "githubRepoContext": {
                  "startingBranch": $starting_branch
                }
              },
              "requirePlanApproval": false,
              "automationMode": "AUTO_CREATE_PR"
            }' > jules_payload.json

          # 3. Round-Robin starting index based on issue number
          NUM_ISSUE=${ISSUE_NUMBER:-1}
          START_IDX=$(( NUM_ISSUE % TOTAL_KEYS ))
          echo "Starting dispatch round-robin at slot index $START_IDX (Issue #$NUM_ISSUE)..."

          INVOKED_SUCCESS=false
          LAST_ERROR=""

          for (( i=0; i<TOTAL_KEYS; i++ )); do
            CURRENT_IDX=$(( (START_IDX + i) % TOTAL_KEYS ))
            CURRENT_KEY="${KEYS[$CURRENT_IDX]}"
            CURRENT_NAME="${KEY_NAMES[$CURRENT_IDX]}"

            echo "▶ Trying Jules API with secret: $CURRENT_NAME (Slot $CURRENT_IDX)..."

            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: $CURRENT_KEY" \
              -d @jules_payload.json)

            BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
            STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | cut -d':' -f2)

            echo "Response Status: $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              SESSION_ID=$(echo "$BODY" | jq -r '.id // .name // empty' | awk -F'/' '{print $NF}')
              echo "✔ Successfully dispatched to Google Jules via $CURRENT_NAME!"
              echo "Session ID: $SESSION_ID"
              echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
              echo "session_url=https://jules.google.com/task/$SESSION_ID" >> $GITHUB_OUTPUT
              echo "key_used=$CURRENT_NAME" >> $GITHUB_OUTPUT
              echo "success=true" >> $GITHUB_OUTPUT
              INVOKED_SUCCESS=true
              break
            else
              echo "⚠️ Key $CURRENT_NAME failed with status $STATUS: $BODY"
              LAST_ERROR="[$CURRENT_NAME, status $STATUS]: $BODY"
            fi
          done

          if [ "$INVOKED_SUCCESS" != "true" ]; then
            echo "::error::All Jules API keys in pool failed! Last error: $LAST_ERROR"
            echo "error_msg=Alle $TOTAL_KEYS Jules API-Keys im Pool sind fehlgeschlagen. Letzter Fehler: $LAST_ERROR" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Update Issue Status on Completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");
            const isSuccess = "${{ steps.jules_call.outputs.success }}" === "true";
            const sessionUrl = "${{ steps.jules_call.outputs.session_url }}";
            const keyUsed = "${{ steps.jules_call.outputs.key_used }}";
            const errorMsg = "${{ steps.jules_call.outputs.error_msg }}";

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'jules:in-progress'
              });
            } catch (e) {}

            if (isSuccess && sessionUrl) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['jules:in-review']
                });
              } catch (e) {}

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🚀 **Google Jules Task gestartet!** (Worker: \`${keyUsed}\`)\n\nDu kannst den Fortschritt und das VM-Log in Echtzeit hier verfolgen:\n👉 [${sessionUrl}](${sessionUrl})\n\nSobald Jules fertig ist, wird der Pull Request automatisch gegen \`dev\` geöffnet.`
              });
            } else {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['jules:failed']
                });
              } catch (e) {}

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ **Google Jules konnte nicht gestartet werden:**\n\`\`\`\n${errorMsg || 'Unbekannter Fehler bei der API-Anfrage.'}\n\`\`\`\nBitte überprüfe dein \`JULES_API_KEY\` Secret unter **Settings → Secrets and variables → Actions**.`
              });
            }

      - name: Live Bridge Jules Activities & Save Transcript
        if: steps.jules_call.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          SESSION_ID: ${{ steps.jules_call.outputs.session_id }}
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const sessionId = process.env.SESSION_ID;
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");

            const keys = [
              process.env.JULES_API_KEY_1,
              process.env.JULES_API_KEY_2,
              process.env.JULES_API_KEY_3,
              process.env.JULES_API_KEY_4,
              process.env.JULES_API_KEY_5,
              process.env.JULES_API_KEY
            ].filter(Boolean);

            if (!sessionId || keys.length === 0) {
              console.log('Skipping live bridge: missing session ID or API keys');
              return;
            }

            const apiKey = keys[0];
            const seenActivityIds = new Set();
            const transcriptEntries = [];

            console.log(`Starting live bridge watcher for Jules session ${sessionId}...`);

            const startTime = Date.now();
            const maxDurationMs = 20 * 60 * 1000; // max 20 minutes monitoring
            const pollIntervalMs = 15 * 1000;    // check every 15 seconds

            let finalState = 'UNKNOWN';

            while (Date.now() - startTime < maxDurationMs) {
              try {
                // 1. Fetch activities
                const actRes = await fetch(`https://jules.googleapis.com/v1alpha/sessions/${sessionId}/activities?pageSize=50`, {
                  headers: { 'X-Goog-Api-Key': apiKey }
                });

                function parseActivity(a) {
                  if (!a) return { time: '', tag: 'SYSTEM', text: '' };
                  const time = a.createTime ? new Date(a.createTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '';
                  let tag = (a.originator || a.type || 'AGENT').toUpperCase();
                  let text = '';

                  if (a.agentMessaged) {
                    const am = a.agentMessaged;
                    text = am.agentMessage || am.message || am.text || am.prompt || am.content || '';
                  } else if (a.userMessaged) {
                    const um = a.userMessaged;
                    text = um.userMessage || um.message || um.text || um.prompt || um.content || '';
                  } else if (a.progressUpdated) {
                    const pu = a.progressUpdated;
                    text = pu.title || pu.description || pu.message || '';
                  } else if (a.planGenerated) {
                    const pg = a.planGenerated;
                    text = pg.plan?.steps ? `Plan mit ${pg.plan.steps.length} Schritten generiert` : (pg.title || 'Plan generiert');
                  } else if (a.sessionCompleted) {
                    text = 'Task erfolgreich abgeschlossen 🎉';
                  } else if (a.sessionFailed) {
                    text = `Task fehlgeschlagen: ${a.sessionFailed.reason || ''}`;
                  }

                  // Check artifacts for code modifications
                  if (!text && a.artifacts && a.artifacts.length > 0) {
                    tag = 'CODE';
                    const files = new Set();
                    for (const art of a.artifacts) {
                      const patch = art.changeSet?.gitPatch?.unidiffPatch || '';
                      const matches = patch.matchAll(/diff --git a\/(\S+) b\/(\S+)/g);
                      for (const m of matches) {
                        const fname = m[2].split('/').pop();
                        files.add(fname);
                      }
                    }
                    if (files.size > 0) {
                      text = '🛠️ Code-Änderungen an: ' + Array.from(files).map(f => '`' + f + '`').join(', ');
                    }
                  }

                  if (!text && typeof a.message === 'string' && a.message) text = a.message;
                  if (!text && typeof a.title === 'string' && a.title) text = a.title;
                  if (!text && typeof a.description === 'string' && a.description) text = a.description;
                  if (!text && typeof a.summary === 'string' && a.summary) text = a.summary;

                  return { time, tag, text: text.trim() || 'Aktivität ausgeführt' };
                }

                if (actRes.ok) {
                  const actData = await actRes.json();
                  const activities = actData.activities || [];

                  // Sort chronologically if createTime present
                  activities.sort((a, b) => (a.createTime || '').localeCompare(b.createTime || ''));

                  for (const act of activities) {
                    if (seenActivityIds.has(act.id)) continue;
                    seenActivityIds.add(act.id);

                    const parsed = parseActivity(act);
                    transcriptEntries.push({
                      id: act.id,
                      time: parsed.time || act.createTime || new Date().toISOString(),
                      originator: parsed.tag,
                      description: parsed.text
                    });

                    // Relay agent messages or questions directly into the GitHub Issue
                    if (parsed.tag === 'AGENT' && parsed.text) {
                      if (parsed.text.length > 20 || parsed.text.includes('?')) {
                        const commentBody = [
                          '### 🤖 Google Jules Chat-Nachricht / Update',
                          '',
                          `> ${parsed.text.replace(/\n/g, '\n> ')}`,
                          '',
                          '---',
                          '💬 *Du kannst direkt auf diese Frage antworten, indem du hier im Issue kommentierst:*',
                          '- `**/continue**` *(fährt mit vorgeschlagenem Ansatz autonom fort)*',
                          '- `**/jules reply <Deine Anweisung>**` *(schickt dein Feedback an Jules)*'
                        ].join('\n');

                        try {
                          await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: issueNumber,
                            body: commentBody
                          });
                          console.log(`Relayed agent message ${act.id} to issue #${issueNumber}`);
                        } catch (cErr) {
                          console.warn('Failed to post comment for activity:', cErr.message);
                        }
                      }
                    }
                  }
                }

                // 2. Fetch session status
                const sessRes = await fetch(`https://jules.googleapis.com/v1alpha/sessions/${sessionId}`, {
                  headers: { 'X-Goog-Api-Key': apiKey }
                });

                if (sessRes.ok) {
                  const sessData = await sessRes.json();
                  finalState = sessData.state || 'IN_PROGRESS';
                  console.log(`Session ${sessionId} state: ${finalState}`);

                  if (finalState === 'COMPLETED' || finalState === 'FAILED') {
                    break;
                  }
                }
              } catch (err) {
                console.warn('Error polling Jules API:', err.message);
              }

              // Sleep 15s
              await new Promise(r => setTimeout(r, pollIntervalMs));
            }

            console.log(`Live bridge concluded with state: ${finalState}. Generating transcript...`);

            // 3. Save transcript to repository
            try {
              const transcriptsDir = path.join(process.cwd(), '.pipeline-memory', 'jules-transcripts');
              if (!fs.existsSync(transcriptsDir)) {
                fs.mkdirSync(transcriptsDir, { recursive: true });
              }

              const transcriptFile = path.join(transcriptsDir, `issue-${issueNumber}-session-${sessionId}.md`);
              const markdown = [
                `# Jules Session Transcript: Issue #${issueNumber}`,
                `- **Session ID:** \`${sessionId}\``,
                `- **Final State:** \`${finalState}\``,
                `- **Archived At:** ${new Date().toISOString()}`,
                '',
                '## Activity & Message Timeline',
                ''
              ];

              for (const entry of transcriptEntries) {
                markdown.push(`### [${entry.time}] ${entry.originator.toUpperCase()}`);
                if (entry.description) markdown.push(`*${entry.description}*`);
                if (entry.agentMessage) markdown.push(`\n\`\`\`\n${entry.agentMessage}\n\`\`\`\n`);
                markdown.push('');
              }

              fs.writeFileSync(transcriptFile, markdown.join('\n'), 'utf8');
              console.log(`Transcript written to ${transcriptFile}`);

              // Commit transcript to dev branch
              const { execSync } = require('child_process');
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync('git fetch origin dev');
              execSync('git checkout dev');
              execSync('git pull origin dev --rebase');
              execSync(`git add "${transcriptFile}"`);
              const diff = execSync('git diff --cached --name-only').toString().trim();
              if (diff) {
                execSync(`git commit -m "docs(jules): archive transcript for issue #${issueNumber} [skip ci]"`);
                execSync('git push origin dev');
                console.log('Transcript pushed to origin/dev');
              }
            } catch (err) {
              console.warn('Failed to commit transcript:', err.message);
            }

  interact-jules:
    name: Relay Command or Feedback to Jules
    needs: triage
    if: (needs.triage.outputs.action == 'reply' || needs.triage.outputs.action == 'approve-plan' || needs.triage.outputs.action == 'status') && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relay Command to Google Jules Session
        uses: actions/github-script@v7
        env:
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          ACTION: ${{ needs.triage.outputs.action }}
          TARGET_TEXT: ${{ needs.triage.outputs.targets }}
        with:
          script: |
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");
            const action = process.env.ACTION;
            const targetText = process.env.TARGET_TEXT;

            // 1. Find the latest Jules session URL in comments
            const commentsRes = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            let sessionId = null;
            for (let i = (commentsRes.data || []).length - 1; i >= 0; i--) {
              const body = commentsRes.data[i].body || '';
              const match = body.match(/https:\/\/jules\.google\.com\/task\/([a-zA-Z0-9_\-]+)/);
              if (match) {
                sessionId = match[1];
                break;
              }
            }

            if (!sessionId) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ **Keine aktive Jules-Session gefunden!**\nAuf Issue #${issueNumber} wurde kein Link zu einer Jules-Task (\`https://jules.google.com/task/...\`) gefunden.`
              });
              core.setFailed('No active Jules session found on issue');
              return;
            }

            // 2. Gather Jules API keys
            const keys = [
              process.env.JULES_API_KEY_1,
              process.env.JULES_API_KEY_2,
              process.env.JULES_API_KEY_3,
              process.env.JULES_API_KEY_4,
              process.env.JULES_API_KEY_5,
              process.env.JULES_API_KEY
            ].filter(Boolean);

            if (keys.length === 0) {
              core.setFailed('No Jules API keys configured in repository secrets');
              return;
            }

            // 3. Handle /status query
            if (action === 'status') {
              let sessData = null;
              let actData = null;
              for (const key of keys) {
                try {
                  const sRes = await fetch(`https://jules.googleapis.com/v1alpha/sessions/${sessionId}`, {
                    headers: { 'X-Goog-Api-Key': key }
                  });
                  if (sRes.ok) {
                    sessData = await sRes.json();
                    const aRes = await fetch(`https://jules.googleapis.com/v1alpha/sessions/${sessionId}/activities?pageSize=20`, {
                      headers: { 'X-Goog-Api-Key': key }
                    });
                    if (aRes.ok) actData = await aRes.json();
                    break;
                  }
                } catch (e) {}
              }

              function parseActivity(a) {
                if (!a) return { time: '', tag: 'SYSTEM', text: '' };
                const time = a.createTime ? new Date(a.createTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '';
                let tag = (a.originator || a.type || 'AGENT').toUpperCase();
                let text = '';

                if (a.agentMessaged) {
                  const am = a.agentMessaged;
                  text = am.agentMessage || am.message || am.text || am.prompt || am.content || '';
                } else if (a.userMessaged) {
                  const um = a.userMessaged;
                  text = um.userMessage || um.message || um.text || um.prompt || um.content || '';
                } else if (a.progressUpdated) {
                  const pu = a.progressUpdated;
                  text = pu.title || pu.description || pu.message || '';
                } else if (a.planGenerated) {
                  const pg = a.planGenerated;
                  text = pg.plan?.steps ? `Plan mit ${pg.plan.steps.length} Schritten generiert` : (pg.title || 'Plan generiert');
                } else if (a.sessionCompleted) {
                  text = 'Task erfolgreich abgeschlossen 🎉';
                } else if (a.sessionFailed) {
                  text = `Task fehlgeschlagen: ${a.sessionFailed.reason || ''}`;
                }

                // Check artifacts for code modifications
                if (!text && a.artifacts && a.artifacts.length > 0) {
                  tag = 'CODE';
                  const files = new Set();
                  for (const art of a.artifacts) {
                    const patch = art.changeSet?.gitPatch?.unidiffPatch || '';
                    const matches = patch.matchAll(/diff --git a\/(\S+) b\/(\S+)/g);
                    for (const m of matches) {
                      const fname = m[2].split('/').pop();
                      files.add(fname);
                    }
                  }
                  if (files.size > 0) {
                    text = '🛠️ Code-Änderungen an: ' + Array.from(files).map(f => '`' + f + '`').join(', ');
                  }
                }

                if (!text && typeof a.message === 'string' && a.message) text = a.message;
                if (!text && typeof a.title === 'string' && a.title) text = a.title;
                if (!text && typeof a.description === 'string' && a.description) text = a.description;
                if (!text && typeof a.summary === 'string' && a.summary) text = a.summary;

                return { time, tag, text: text.trim() || 'Aktivität ausgeführt' };
              }

              const state = sessData?.state || 'UNKNOWN';
              const rawActivities = actData?.activities || [];
              const activities = rawActivities.slice(-6);
              const actLines = activities.map(a => {
                const p = parseActivity(a);
                const prefix = p.time ? `\`${p.time}\` ` : '';
                const maxLen = 120;
                const truncated = p.text.length > maxLen ? p.text.slice(0, maxLen).replace(/\n/g, ' ') + '...' : p.text.replace(/\n/g, ' ');
                return `- ${prefix}**[${p.tag}]** ${truncated}`;
              }).join('\n');

              // Extract last question if waiting for feedback
              let pendingQuestion = '';
              for (let i = rawActivities.length - 1; i >= 0; i--) {
                const act = rawActivities[i];
                if (act.agentMessaged?.agentMessage) {
                  pendingQuestion = act.agentMessaged.agentMessage;
                  break;
                }
                const p = parseActivity(act);
                if (p.tag === 'AGENT' && (p.text.includes('?') || p.text.toLowerCase().includes('proceed') || p.text.toLowerCase().includes('approach'))) {
                  pendingQuestion = p.text;
                  break;
                }
              }

              let statusBody = `📊 **Jules Task Status (Session: \`${sessionId}\`):**\n\n- **Status:** \`${state}\`\n- **Web UI:** https://jules.google.com/task/${sessionId}\n\n`;

              if ((state === 'AWAITING_USER_FEEDBACK' || state === 'AWAITING_USER_INPUT') && pendingQuestion) {
                statusBody += `### ⚠️ Jules wartet auf dein Feedback:\n> ${pendingQuestion.replace(/\n/g, '\n> ')}\n\n👉 **Antworte direkt hier mit:**\n- \`/continue\` *(um den vorgeschlagenen Ansatz freizugeben)*\n- \`/jules reply <Deine Anweisung>\` *(für individuelles Feedback)*\n\n---\n`;
              }

              statusBody += `**Letzte Aktivitäten:**\n${actLines || '- Keine Aktivitäten verfügbar.'}\n\n---\n*Tipp: Kommentiere mit \`/continue\` zum Weitermachen oder \`/jules reply <Text>\` zum Antworten.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: statusBody
              });
              return;
            }

            // 4. Handle approve-plan and reply
            const endpoint = action === 'approve-plan'
              ? `https://jules.googleapis.com/v1alpha/sessions/${sessionId}:approvePlan`
              : `https://jules.googleapis.com/v1alpha/sessions/${sessionId}:sendMessage`;

            const payload = action === 'approve-plan' ? {} : { prompt: targetText };

            let success = false;
            let lastError = '';

            for (const key of keys) {
              try {
                const res = await fetch(endpoint, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-Goog-Api-Key': key
                  },
                  body: JSON.stringify(payload)
                });

                if (res.ok) {
                  success = true;
                  break;
                } else {
                  const txt = await res.text();
                  lastError = `Status ${res.status}: ${txt}`;
                }
              } catch (e) {
                lastError = e.message;
              }
            }

            if (success) {
              if (action === 'approve-plan') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `✅ **Jules-Plan freigegeben!** (Session: \`${sessionId}\`)\nJules setzt die Implementierung der Task jetzt auf \`dev\` fort.`
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `💬 **Nachricht an Google Jules übermittelt!** (Session: \`${sessionId}\`)\n> "${targetText}"\n\nJules hat die Anweisung erhalten und arbeitet autonom weiter.`
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ **Konnte Nachricht nicht an Jules übermitteln:**\n\`\`\`\n${lastError}\n\`\`\``
              });
              core.setFailed(`Failed to send to Jules: ${lastError}`);
            }

