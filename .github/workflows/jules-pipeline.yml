name: Jules Issue Auto-Fix Pipeline

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue Number to resolve'
        required: true
        type: number
      mode:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - fix
          - yolo
          - curate
          - curate-all
      yolo:
        description: 'Enable YOLO mode (maximum autonomy, zero intermediate questions)'
        required: false
        type: boolean
        default: false

concurrency:
  group: jules-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event_name == 'issue_comment' && 'comment' || 'pipeline' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Determine Trigger & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.decide.outputs.action }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      is_authorized: ${{ steps.decide.outputs.is_authorized }}
      lens_name: ${{ steps.decide.outputs.lens_name }}
      targets: ${{ steps.decide.outputs.targets }}
      yolo: ${{ steps.decide.outputs.yolo }}
    steps:
      - name: Evaluate command and permissions
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let action = 'skip';
            let issueNumber = null;
            let isAuthorized = false;
            let lensName = '';
            let targets = '';
            let isYolo = false;

            // Security check: Only allow repo owner, members, or collaborators
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            if (eventName === 'workflow_dispatch') {
              action = context.payload.inputs.mode;
              if (action === 'yolo') {
                action = 'fix';
                isYolo = true;
              }
              if (context.payload.inputs.yolo) {
                isYolo = true;
              }
              issueNumber = context.payload.inputs.issue_number;
              isAuthorized = true; // workflow_dispatch already requires repository write access
            } else if (eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const issue = context.payload.issue;

              // Do not run on Pull Requests, only standalone Issues
              if (!issue.pull_request) {
                issueNumber = issue.number;
                const authorAssoc = comment.author_association;
                isAuthorized = trustedRoles.includes(authorAssoc);

                const rawBody = (comment.body || '').trim();
                const body = rawBody.toLowerCase();
                const hasYoloFlag = /\b(-{1,2})yolo\b/i.test(rawBody);
                if (hasYoloFlag) isYolo = true;

                if (body.startsWith('/bundle')) {
                  action = 'bundle';
                  const matches = rawBody.match(/#?(\d+)/g) || [];
                  targets = matches.map(m => m.replace('#', '')).filter(m => m !== String(issueNumber)).join(',');
                } else if (body.startsWith('/duplicate')) {
                  action = 'duplicate';
                  const match = rawBody.match(/#?(\d+)/);
                  if (match) targets = match[1];
                } else if (body.startsWith('/jules lens')) {
                  action = 'fix';
                  const parts = body.split(/\s+/);
                  if (parts.length > 2) {
                    lensName = parts[2].trim();
                  }
                } else {
                  // 1. Check if there is an active session
                  let hasSession = false;
                  try {
                    const commentsRes = await github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      per_page: 50
                    });
                    for (let i = (commentsRes.data || []).length - 1; i >= 0; i--) {
                      const cBody = commentsRes.data[i].body || '';
                      if (cBody.includes('https://jules.google.com/task/')) {
                        hasSession = true;
                        break;
                      }
                    }
                  } catch (e) {}

                  // 2. Route commands based on session state
                  if (body.startsWith('/yolo') || body.startsWith('/jules yolo')) {
                    action = hasSession ? 'yolo' : 'fix';
                  } else if (body.startsWith('/jules reply') || body.startsWith('/reply')) {
                    action = 'reply';
                    const replyText = rawBody.replace(/^\/(jules\s+)?reply\s*/i, '').replace(/--yolo|-yolo/gi, '').trim();
                    targets = replyText || 'Please proceed autonomously with the proposed solution and create the pull request.';
                  } else if (body.startsWith('/continue') || body.startsWith('/jules continue') || body.startsWith('/approve') || body.startsWith('/jules approve') || body.startsWith('/approve-plan')) {
                    if (hasSession) {
                      action = hasYoloFlag ? 'yolo' : 'continue';
                      const replyText = rawBody.replace(/^\/(jules\s+)?(continue|approve|approve-plan)\s*/i, '').replace(/--yolo|-yolo/gi, '').trim();
                      targets = replyText || 'Continue with the suggested approach.';
                    } else {
                      action = 'fix';
                    }
                  } else if (body.startsWith('/status') || body.startsWith('/jules status')) {
                    action = 'status';
                  } else if (body.startsWith('/jules plan') || body.startsWith('/plan') || body.startsWith('/jules fix') || body.startsWith('/fix')) {
                    // Start a new interactive session
                    action = 'fix';
                  }
                }
              }
            } else if (eventName === 'issues' && context.payload.action === 'opened') {
              const issue = context.payload.issue;
              if (!issue.pull_request) {
                issueNumber = issue.number;
                isAuthorized = true;
              }
            } else if (eventName === 'issues' && context.payload.action === 'labeled') {
              const labelName = context.payload.label.name.toLowerCase();
              const issue = context.payload.issue;
              const sender = context.payload.sender.login;

              if (!issue.pull_request) {
                issueNumber = issue.number;
                // Sender authorization check
                const authorAssoc = issue.author_association;
                isAuthorized = trustedRoles.includes(authorAssoc) || sender === context.repo.owner;

                if (labelName === 'bundle' || labelName === 'auto-bundle' || labelName === 'bundle-related' || labelName === 'jules:bundle') {
                  action = 'auto-bundle';
                } else if (labelName === 'duplicate' || labelName === 'jules:duplicate') {
                  action = 'auto-duplicate';
                } else if (labelName.startsWith('lens:')) {
                  action = 'fix';
                  lensName = labelName.replace('lens:', '').trim();
                } else if (labelName === 'jules' || labelName === 'jules:plan' || labelName === 'plan' || labelName === 'game-factory') {
                  action = 'plan';
                } else if (labelName === 'yolo' || labelName === 'jules:yolo') {
                  action = 'fix';
                  isYolo = true;
                } else if (labelName === 'jules:approved' || labelName === 'jules:fix' || labelName === 'approved' || labelName === 'fix' || labelName === 'approve') {
                  action = 'fix';
                }
              }
            }

            console.log({ action, issueNumber, isAuthorized, lensName, targets, isYolo });
            core.setOutput('action', action);
            core.setOutput('issue_number', issueNumber);
            core.setOutput('is_authorized', isAuthorized ? 'true' : 'false');
            core.setOutput('lens_name', lensName);
            core.setOutput('targets', targets);
            core.setOutput('yolo', isYolo ? 'true' : 'false');

  generate-plan:
    name: Generate Implementation Plan
    needs: triage
    if: needs.triage.outputs.action == 'plan' && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve RepoLens Lens (if specified)
        id: lens_resolver
        if: needs.triage.outputs.lens_name != ''
        run: |
          node scripts/jules-lens-resolver.mjs --lens "${{ needs.triage.outputs.lens_name }}"

      - name: Run Plan Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          LENS_PROMPT: ${{ steps.lens_resolver.outputs.prompt }}
          LENS_NAME: ${{ steps.lens_resolver.outputs.lens_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/jules-plan-generator.mjs --issue ${{ needs.triage.outputs.issue_number }}

  execute-jules:
    name: Execute Task with Google Jules
    needs: triage
    if: needs.triage.outputs.action == 'fix' && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure dev branch exists on origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --heads origin dev | grep -q 'refs/heads/dev'; then
            echo "Branch 'dev' does not exist on origin. Creating 'dev' from 'main'..."
            git fetch origin main
            git push origin origin/main:refs/heads/dev
          else
            echo "Branch 'dev' already exists on origin."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve RepoLens Lens (if specified)
        id: lens_resolver
        if: needs.triage.outputs.lens_name != ''
        run: |
          node scripts/jules-lens-resolver.mjs --lens "${{ needs.triage.outputs.lens_name }}"

      - name: Fetch Issue Context & Prepare Prompt
        id: prep
        uses: actions/github-script@v7
        env:
          LENS_PROMPT: ${{ steps.lens_resolver.outputs.prompt }}
          LENS_NAME: ${{ steps.lens_resolver.outputs.lens_name }}
          YOLO_MODE: ${{ needs.triage.outputs.yolo }}
        with:
          script: |
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const lensPrompt = process.env.LENS_PROMPT || '';
            const lensName = process.env.LENS_NAME || '';
            const isYolo = process.env.YOLO_MODE === 'true';

            // Dispatch confirmation is posted after successful API call in 'Update Issue Status on Completion'

            // Update labels
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'jules:waiting-approval'
              });
            } catch (e) {}

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['jules:in-progress']
              });
            } catch (e) {}

            // Fetch relevant user feedback from comments (exclude bots & slash commands)
            let commentsContext = '';
            try {
              const commentsRes = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 50
              });
              const filteredComments = (commentsRes.data || []).filter(c => {
                const author = c.user?.login || '';
                const body = (c.body || '').trim();
                // Skip bot authors
                if (c.user?.type === 'Bot' || author.includes('[bot]') || author === 'github-actions') return false;
                // Skip pipeline-generated comments (status reports, relay headers)
                if (body.startsWith('## 🤖') || body.startsWith('### 🔍') || body.startsWith('📊') || body.startsWith('🤖') || body.startsWith('⚡') || body.startsWith('▶️') || body.startsWith('💬') || body.startsWith('❌') || body.startsWith('✅')) return false;
                // Skip pure slash commands with no substantive text
                if (/^\/(jules\s+)?(fix|status|plan|continue|yolo|approve-plan|curate|triage|dedup|bundle|check|duplicate)\b/i.test(body) && body.split(/\s+/).length <= 3) return false;
                return body.length > 0;
              });
              if (filteredComments.length > 0) {
                commentsContext = '\n\nUser Feedback & Clarifications from Issue Comments:\n' +
                  filteredComments.map(c => `- @${c.user?.login}: ${c.body.trim()}`).join('\n\n');
              }
            } catch (err) {
              console.warn('Could not fetch comments for Jules prompt:', err.message);
            }

            const yoloBanner = isYolo ? \`
            ⚡⚡⚡ YOLO MODE: MAXIMUM AUTONOMOUS EXECUTION ENGAGED ⚡⚡⚡
            - ABSOLUTE ZERO HUMAN INTERACTION: Do NOT ask for confirmation, feedback, or approval under any circumstances.
            - FULL PROACTIVE AUTHORITY: You are strictly required to make all architectural, refactoring, and file decomposition decisions yourself.
            - IMMEDIATELY create/extract sub-components or custom hooks if limits are exceeded.
            - Proceed continuously from planning to coding, running Vitest tests, verifying quality gates, and submitting the Pull Request against 'dev'. Never pause or wait for user input.
            \` : \`
            🤖 INTERACTIVE MODE: PLAN & APPROVE
            YOUR MISSION HAS TWO STRICT PHASES. YOU MUST STOP AFTER PHASE 1.
            
            === PHASE 1: PLANNING (CURRENT PHASE) ===
            - Step 1: Analyze the issue and formulate a concrete implementation plan.
            - Step 2: Present the plan to the user and explicitly ASK FOR APPROVAL.
            - Step 3: Wait for the user's response. DO NOT WRITE CODE OR CREATE A PR YET.
            
            === PHASE 2: IMPLEMENTATION (ONLY AFTER USER APPROVAL) ===
            When the user replies with approval or further instructions, proceed to implementation following the strict rules below:
            \`;

            const prompt = \`
            Task: Fix GitHub Issue #\${issueNumber}: \${issue.data.title}
            
            \${yoloBanner}

            Issue Description:
            \${issue.data.body || 'No description provided'}\${commentsContext}

            \${lensPrompt ? \`\\nSPECIALIZED REPOLENS AUDIT FOCUS:\\n\${lensPrompt}\\n\` : ''}

            Target, Branch & PR Instructions (Apply ONLY during Phase 2 / YOLO Mode):
            - Your base branch is 'dev'.
            - When creating a pull request, TARGET THE 'dev' BRANCH (not 'main').
            - In the PR description, you MUST include a detailed "Implementation Summary" section:
              * Reference 'Fixes #\${issueNumber}' to auto-close the issue.
              * List what was implemented and why.
              * List all changed files and their purposes.
              * List the quality gates you verified.
            - Do NOT post the implementation summary as an issue comment. The PR description is sufficient.

            MANDATORY OUTPUT FILES — CI will reject your PR without these (Phase 2):
            1. CHANGELOG.md — Add an entry under [Unreleased] describing what was changed or fixed.
            2. docs/tech/architecture.md — Update if system structure, new modules, or new components were added.
            3. public/locales/de/translation.json AND public/locales/en/translation.json — Update both if any user-facing strings were added or changed.
            Run 'npm run check:docs' BEFORE committing to verify these files are included. It WILL fail your PR if omitted.

            Mandatory Project Rules (from AGENTS.md):
            - Maximum 250 lines per .tsx component. Decompose larger components into hooks and sub-components.
            - No cross-game imports: src/games/<A> must never import from src/games/<B>.
            - Use src/lib/storage.ts for storage with STORAGE_KEYS. Never raw localStorage or sessionStorage.
            - Use MUI <Dialog> or <ConfirmDialog>. Never native window.confirm() or alert().
            - Strict TypeScript: no 'any'. Use discriminated unions.
            - Zero Code Duplication: Search src/modules/ and reuse existing code. 'npm run check:duplicates' will reject PRs with copy-paste clones.

            Verification Checklist (run ALL before creating PR in Phase 2):
            - npm run check:docs (mandatory output files gate)
            - npm run check:architecture:diff
            - npm run check:duplicates
            - npm run check:budget
            - npm test
            - npm run build
            \`;

            core.setOutput('prompt', prompt);

      - name: Invoke Google Jules Agent
        id: jules_call
        env:
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          STARTING_BRANCH: 'dev'
          REPO: ${{ github.repository }}
          USER_PROMPT: ${{ steps.prep.outputs.prompt }}
        shell: bash
        run: |
          set +e # Prevent script from exiting immediately on curl/jq errors
          # 1. Collect all available Jules API keys from secrets
          declare -a KEYS=()
          declare -a KEY_NAMES=()

          if [ -n "$JULES_API_KEY_1" ]; then KEYS+=("$JULES_API_KEY_1"); KEY_NAMES+=("JULES_API_KEY_1"); fi
          if [ -n "$JULES_API_KEY_2" ]; then KEYS+=("$JULES_API_KEY_2"); KEY_NAMES+=("JULES_API_KEY_2"); fi
          if [ -n "$JULES_API_KEY_3" ]; then KEYS+=("$JULES_API_KEY_3"); KEY_NAMES+=("JULES_API_KEY_3"); fi
          if [ -n "$JULES_API_KEY_4" ]; then KEYS+=("$JULES_API_KEY_4"); KEY_NAMES+=("JULES_API_KEY_4"); fi
          if [ -n "$JULES_API_KEY_5" ]; then KEYS+=("$JULES_API_KEY_5"); KEY_NAMES+=("JULES_API_KEY_5"); fi

          # Fallback to JULES_API_KEY if none of the numbered keys exist
          if [ ${#KEYS[@]} -eq 0 ] && [ -n "$JULES_API_KEY" ]; then
            KEYS+=("$JULES_API_KEY")
            KEY_NAMES+=("JULES_API_KEY")
          fi

          TOTAL_KEYS=${#KEYS[@]}
          if [ "$TOTAL_KEYS" -eq 0 ]; then
            echo "error_msg=Kein JULES_API_KEY oder JULES_API_KEY_1..5 in den GitHub Repository Secrets hinterlegt." >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            echo "::error::No Jules API key secrets configured!"
            exit 1
          fi

          echo "Found $TOTAL_KEYS Jules API key(s) in pool: ${KEY_NAMES[*]}"

          # 2. Prepare payload
          echo "$USER_PROMPT" > prompt.txt

          jq -n \
            --rawfile jules_prompt prompt.txt \
            --arg starting_branch "$STARTING_BRANCH" \
            --arg repo_full_name "$REPO" \
            '{
              "prompt": $jules_prompt,
              "sourceContext": {
                "source": "sources/github/\($repo_full_name)",
                "githubRepoContext": {
                  "startingBranch": $starting_branch
                }
              },
              "requirePlanApproval": false,
              "automationMode": "AUTO_CREATE_PR"
            }' > jules_payload.json

          # 3. Round-Robin starting index based on issue number
          NUM_ISSUE=${ISSUE_NUMBER:-1}
          START_IDX=$(( NUM_ISSUE % TOTAL_KEYS ))
          echo "Starting dispatch round-robin at slot index $START_IDX (Issue #$NUM_ISSUE)..."

          INVOKED_SUCCESS=false
          LAST_ERROR=""

          for (( i=0; i<TOTAL_KEYS; i++ )); do
            CURRENT_IDX=$(( (START_IDX + i) % TOTAL_KEYS ))
            CURRENT_KEY="${KEYS[$CURRENT_IDX]}"
            CURRENT_NAME="${KEY_NAMES[$CURRENT_IDX]}"

            echo "▶ Trying Jules API with secret: $CURRENT_NAME (Slot $CURRENT_IDX)..."

            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: $CURRENT_KEY" \
              -d @jules_payload.json)

            BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
            STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | cut -d':' -f2)

            echo "Response Status: $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              SESSION_ID=$(echo "$BODY" | jq -r '.id // .name // empty' | awk -F'/' '{print $NF}')
              echo "✔ Successfully dispatched to Google Jules via $CURRENT_NAME!"
              echo "Session ID: $SESSION_ID"
              echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
              echo "session_url=https://jules.google.com/task/$SESSION_ID" >> $GITHUB_OUTPUT
              echo "key_used=$CURRENT_NAME" >> $GITHUB_OUTPUT
              echo "success=true" >> $GITHUB_OUTPUT
              INVOKED_SUCCESS=true
              break
            else
              echo "⚠️ Key $CURRENT_NAME failed with status $STATUS: $BODY"
              LAST_ERROR="[$CURRENT_NAME, status $STATUS]: $BODY"
            fi
          done

          if [ "$INVOKED_SUCCESS" != "true" ]; then
            echo "::error::All Jules API keys in pool failed! Last error: $LAST_ERROR"
            {
              echo "error_msg<<EOF_ERR"
              echo "Alle $TOTAL_KEYS Jules API-Keys im Pool sind fehlgeschlagen. Letzter Fehler: $LAST_ERROR"
              echo "EOF_ERR"
            } >> "$GITHUB_OUTPUT"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Update Issue Status on Completion
        if: always()
        uses: actions/github-script@v7
        env:
          SUCCESS: ${{ steps.jules_call.outputs.success }}
          SESSION_URL: ${{ steps.jules_call.outputs.session_url }}
          KEY_USED: ${{ steps.jules_call.outputs.key_used }}
          ERROR_MSG: ${{ steps.jules_call.outputs.error_msg }}
        with:
          script: |
            const issueNumber = Number("${{ needs.triage.outputs.issue_number }}");
            const isSuccess = process.env.SUCCESS === "true";
            const sessionUrl = process.env.SESSION_URL || '';
            const keyUsed = process.env.KEY_USED || '';
            const errorMsg = process.env.ERROR_MSG || '';

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'jules:in-progress'
              });
            } catch (e) {}

            if (isSuccess && sessionUrl) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['jules:in-review']
                });
              } catch (e) {}

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 **Google Jules Dispatched** (Worker: \`${keyUsed}\`)\n\n👉 [${sessionUrl}](${sessionUrl})\nPR targeting \`dev\` will be opened once implementation and verification are complete.`
              });
            } else {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['jules:failed']
                });
              } catch (e) {}

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ **Google Jules dispatch failed:**\n\`\`\`\n${errorMsg || 'Unknown API error.'}\n\`\`\`\nCheck your \`JULES_API_KEY\` secret under **Settings → Secrets and variables → Actions**.`
              });
            }

      - name: Live Bridge Jules Activities & Save Transcript
        if: steps.jules_call.outputs.success == 'true'
        uses: actions/github-script@v7
        env:
          SESSION_ID: ${{ steps.jules_call.outputs.session_id }}
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          script: |
            const liveBridge = require('./scripts/pipeline/jules-live-bridge.js');
            await liveBridge({ github, context, core });

  interact-jules:
    name: Relay Command or Feedback to Jules
    needs: triage
    if: (needs.triage.outputs.action == 'reply' || needs.triage.outputs.action == 'continue' || needs.triage.outputs.action == 'yolo' || needs.triage.outputs.action == 'approve-plan' || needs.triage.outputs.action == 'status') && needs.triage.outputs.is_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Relay Command to Google Jules Session
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
