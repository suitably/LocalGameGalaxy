name: Release (Consolidated & Gated)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or release version to build (e.g. v1.1.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  gates:
    name: Verify Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      # Blocking here, advisory in ci.yml (#592). Accepted advisories: scripts/audit-allowlist.json
      - name: Production Dependency Audit (high/critical, blocking)
        run: npm run check:security

      - name: Run Repository Hygiene
        run: npm run check:hygiene

      - name: Run Pipeline Scripts Tests
        run: npm run test:scripts

      - name: Run Component Budget Gate
        run: npm run check:budget

      - name: Run Full Architecture Audit
        run: npm run check:architecture

      - name: Run Duplication Check
        run: npm run check:duplicates

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test

      - name: Verify Web Production Build
        run: npm run build

      - name: Install & Test Server
        working-directory: ./server
        run: |
          npm ci
          npm run build
          npm test

  create-release:
    name: Create Draft Release
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes

  build-android:
    name: Build & Attach Android APK
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Release Keystore if Configured
        id: setup_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured and decoded."
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # a tag release never ships a debug-signed APK (#590): it could not be updated later
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; a tag release needs the release keystore."
            exit 1
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not configured. Manual run: building nexumia-debug.apk as a workflow artifact only."
          fi

      - name: Build APK (Release, or Debug on Manual Runs)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.setup_signing.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../nexumia.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../nexumia-debug.apk
          fi

      - name: Attest APK Build Provenance
        if: steps.setup_signing.outputs.has_keystore == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nexumia.apk

      - name: Upload APK to Draft Release
        if: steps.setup_signing.outputs.has_keystore == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" nexumia.apk --clobber

      # Debug builds never become a release asset; they stay on the workflow run.
      - name: Upload Debug APK as Workflow Artifact
        if: steps.setup_signing.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexumia-debug-apk
          path: nexumia-debug.apk

  build-server-binaries:
    name: Build & Attach Server Binaries
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Binaries (pkg)
        working-directory: ./server
        run: npm run package

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release/linux/scripts release/windows/scripts release/macos/scripts

          # Lyric alignment script (found via <cwd>/scripts/ — the launchers cd into their own folder)
          # and one empty data folder per plugin (songs, Tabletop games, Melodiq Notes library)
          for os in linux windows macos; do
            cp server/src/scripts/align_lyrics.py "release/$os/scripts/"
            mkdir -p "release/$os/music" "release/$os/tabletop" "release/$os/notes"
          done

          # Linux
          cp server/dist/nexumia-server-linux release/linux/
          cp server/release-scripts/start-server.sh release/linux/
          cp server/release-scripts/NexumiaServer.desktop release/linux/
          chmod +x release/linux/nexumia-server-linux release/linux/start-server.sh

          # Windows
          cp server/dist/nexumia-server-win.exe release/windows/
          cp server/release-scripts/start-server.bat release/windows/

          # macOS
          cp server/dist/nexumia-server-macos release/macos/
          cp server/release-scripts/start-server.command release/macos/
          chmod +x release/macos/nexumia-server-macos release/macos/start-server.command

      - name: Create Archives
        run: |
          cd release/linux && tar -czf ../../nexumia-server-linux.tar.gz ./* && cd ../..
          cd release/windows && zip -r ../../nexumia-server-win.zip ./* && cd ../..
          cd release/macos && tar -czf ../../nexumia-server-macos.tar.gz ./* && cd ../..

      - name: Attest Server Archives Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nexumia-server-linux.tar.gz
            nexumia-server-macos.tar.gz
            nexumia-server-win.zip

      - name: Upload Server Archives to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            nexumia-server-linux.tar.gz \
            nexumia-server-macos.tar.gz \
            nexumia-server-win.zip \
            --clobber

  # pkg cannot cross-compile bytecode for another CPU, so ARM64 builds run on ARM runners
  build-server-binaries-arm64:
    name: Build & Attach Server Binaries (${{ matrix.archive }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: node24-linux-arm64
            binary: nexumia-server-linux
            launchers: start-server.sh NexumiaServer.desktop
            archive: nexumia-server-linux-arm64
          - runner: macos-15
            target: node24-macos-arm64
            binary: nexumia-server-macos
            launchers: start-server.command
            archive: nexumia-server-macos-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Binary (pkg)
        working-directory: ./server
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm run bundle
          npx pkg dist/nexumia-server.cjs --targets "$TARGET" --output dist/nexumia-server-arm64

      - name: Create Archive
        env:
          BINARY: ${{ matrix.binary }}
          LAUNCHERS: ${{ matrix.launchers }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p release/scripts release/music release/tabletop release/notes
          cp server/src/scripts/align_lyrics.py release/scripts/
          # same file name as the x64 build, so the launchers work unchanged
          cp server/dist/nexumia-server-arm64 "release/$BINARY"
          for launcher in $LAUNCHERS; do cp "server/release-scripts/$launcher" release/; done
          chmod +x release/nexumia-server-* release/start-server.*
          tar -czf "$ARCHIVE.tar.gz" -C release .

      - name: Attest Archive Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}.tar.gz

      - name: Upload Archive to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: gh release upload "$TAG" "$ARCHIVE.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  # CycloneDX SBOMs of the production dependencies (root app, companion server, signaling tracker)
  sbom:
    name: Generate & Attach SBOMs
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - lockfile: package-lock.json
            asset: nexumia-sbom.cdx.json
          - lockfile: server/package-lock.json
            asset: nexumia-server-sbom.cdx.json
          - lockfile: signaling/package-lock.json
            asset: nexumia-signaling-sbom.cdx.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ matrix.lockfile }}
          format: cyclonedx-json
          output-file: ${{ matrix.asset }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload SBOM to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  # The called workflow pushes to Docker Hub and GHCR and attests both (#592)
  build-docker:
    name: Build & Push Docker Images
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  publish-release:
    name: Undraft & Publish Release
    needs:
      [
        create-release,
        build-android,
        build-server-binaries,
        build-server-binaries-arm64,
        sbom,
        build-docker,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Undraft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "🎉 Release $TAG is now published!"
