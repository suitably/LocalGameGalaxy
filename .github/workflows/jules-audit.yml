name: Jules Scheduled Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent ID to run (e.g. "security" or "all")'
        default: 'all'
        required: false
        type: string

concurrency:
  group: jules-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_TARGET: ${{ github.event.inputs.agent || 'all' }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
        with:
          script: |
            await require('./scripts/pipeline/jules-agent-runner.cjs')({ github, context, core });
