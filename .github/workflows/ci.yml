name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precheck:
    name: Deterministic Prechecks (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Repository hygiene (artifacts, conflicts, JSON, i18n parity, secrets, workflows)
        run: npm run check:hygiene

      - name: Unit tests for pipeline scripts
        run: npm run test:scripts

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  static-analysis:
    name: Architecture, Budget & Duplicates
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup

      - name: Architecture & Boundary Check (Changed Files)
        if: github.event_name == 'pull_request'
        run: npm run check:architecture:diff

      - name: Architecture & Boundary Audit (Full Report)
        if: github.event_name == 'push'
        run: npm run check:architecture

      - name: Check Component Size Budget (Anti-God-Component Gate)
        run: npm run check:budget

      - name: Check Code Duplication (Anti-Copy-Paste Gate)
        run: npm run check:duplicates

      - name: Check Documentation & Translation Sync Gate (RepoLens Standard)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:docs

  lint:
    name: ESLint & Security Audit
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: npm run lint

      - name: Production Security Audit (advisory, high severity)
        continue-on-error: true
        run: npm run check:security

  test:
    name: Unit & Integration Tests (Vitest)
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup

      - name: Run Unit Tests
        run: npm test -- --reporter=default --reporter=github-actions

  build:
    name: Production Web Build
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup

      - name: Run Production Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  server-validate:
    name: Server Build & Tests
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup
        with:
          working-directory: server
          cache-dependency-path: server/package-lock.json

      - name: Build server (tsc)
        working-directory: server
        run: npm run build

      - name: Run server tests
        working-directory: server
        run: npm test

  ci-ok:
    name: CI Quality Gate (Aggregator)
    needs: [precheck, static-analysis, lint, test, build, server-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Check Results
        run: |
          STATUSES="${{ join(needs.*.result, ' ') }}"
          echo "Dependency statuses: $STATUSES"
          if echo "$STATUSES" | grep -E -q '(failure|cancelled)'; then
            echo "::error::One or more required CI gate jobs failed or were cancelled."
            exit 1
          fi
          echo "🎉 All required CI gates passed successfully!"

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: [build, ci-ok]
    # Fork PRs and bot PRs have no access to secrets -> skip instead of failing.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && github.actor != 'dependabot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare
        id: cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'preview' }}

      - name: Comment PR with Preview Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const handlePreviewComment = require('./scripts/pipeline/preview-comment.cjs');
            await handlePreviewComment({ github, context, core }, {
              status: 'deployed',
              deploymentUrl: process.env.DEPLOYMENT_URL || ''
            });
