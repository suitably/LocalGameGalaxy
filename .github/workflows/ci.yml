name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Architecture, Budget, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture & Boundary Check (Changed Files)
        if: github.event_name == 'pull_request'
        run: npm run check:architecture:diff

      - name: Architecture & Boundary Audit (Full Report)
        if: github.event_name == 'push'
        run: npm run check:architecture

      - name: Check Component Size Budget (Anti-God-Component Gate)
        run: npm run check:budget

      - name: Check Code Duplication (Anti-Copy-Paste Gate)
        run: npm run check:duplicates

      - name: Check Documentation & Translation Sync Gate (RepoLens Standard)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:docs

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Production Build
        run: npm run build

      - name: Deploy to Cloudflare
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'preview' }}

      - name: Comment PR with Preview Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref || '';
            const sanitizedBranch = branch.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            const previewUrl = sanitizedBranch ? `https://${sanitizedBranch}.nexumia.de/` : ("${{ steps.cloudflare.outputs.deployment-url }}" || '');
            const prNumber = context.payload.pull_request.number;

            // 1. Post or update PR deployment comment
            const commentHeader = '### 🚀 Cloudflare Preview Deployment';
            const body = `${commentHeader}\n\n👉 **Preview URL:** [${previewUrl}](${previewUrl})\n\nBranch: \`${branch}\``;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 50
              });

              const existingComment = comments.find(c => c.body?.includes(commentHeader));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body
                });
              }
            } catch (err) {
              console.warn('Could not post PR comment:', err.message);
            }

            // 2. Also ensure Preview link is added to the PR body description
            try {
              const currentBody = context.payload.pull_request.body || '';
              if (!currentBody.includes('nexumia.de') && previewUrl) {
                const updatedBody = `> 🚀 **Cloudflare Preview:** [${previewUrl}](${previewUrl})\n\n${currentBody}`;
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: updatedBody
                });
              }
            } catch (err) {
              console.warn('Could not update PR body:', err.message);
            }

