name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Lint, Architecture, Budget, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture & Boundary Check (Changed Files)
        if: github.event_name == 'pull_request'
        run: npm run check:architecture:diff

      - name: Architecture & Boundary Audit (Full Report)
        if: github.event_name == 'push'
        run: npm run check:architecture

      - name: Check Component Size Budget (Anti-God-Component Gate)
        run: npm run check:budget

      - name: Check Code Duplication (Anti-Copy-Paste Gate)
        run: npm run check:duplicates

      - name: Check Documentation & Translation Sync Gate (RepoLens Standard)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:docs

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

  auto-merge-dev:
    name: Auto-Merge Verified PR into Dev
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Automatically Merge PR into dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "🚀 All quality gates passed! Auto-merging PR #${PR_NUMBER} into dev..."
          
          # Try GitHub CLI squash merge first
          if gh pr merge "${PR_NUMBER}" --squash --delete-branch; then
            echo "✔ PR #${PR_NUMBER} successfully merged via GitHub CLI."
            exit 0
          fi

          echo "⚠️ gh pr merge failed or requires bypass, falling back to direct git merge..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin dev
          git fetch origin "${HEAD_BRANCH}"
          git checkout dev
          git merge --squash "origin/${HEAD_BRANCH}" -m "chore: auto-merge PR #${PR_NUMBER} into dev (verified by CI quality gates)"
          git push origin dev
          echo "✔ Changes successfully merged and pushed to dev."

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: validate
    # Only run on pushes to main or dev, not on PRs (to avoid leaking secrets or deploying untested code)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Production Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'preview' }}
