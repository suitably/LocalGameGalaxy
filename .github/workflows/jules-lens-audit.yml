name: Jules RepoLens Audit Suite

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'RepoLens Domain'
        required: true
        default: 'architecture'
        type: choice
        options:
          - architecture
          - performance
          - testing
          - security
          - frontend
          - android
          - code-quality
          - error-handling
          - concurrency
          - maintainability
      lens:
        description: 'Specific Lens ID (e.g. single-responsibility, module-boundaries, algorithm, memory, unit-test-gaps, secrets). Leave blank for domain default.'
        required: false
        default: ''
        type: string
      mode:
        description: 'Audit Action Mode'
        required: true
        default: 'fix'
        type: choice
        options:
          - fix
          - plan
      repolens_repo:
        description: 'RepoLens Repository (change to your fork if desired)'
        required: false
        default: 'TheMorpheus407/RepoLens'
        type: string
      repolens_branch:
        description: 'RepoLens Branch'
        required: false
        default: 'master'
        type: string

  schedule:
    - cron: '0 3 * * 1' # Runs a weekly architecture lens audit every Monday at 3 AM

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    name: Execute RepoLens Audit with Jules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LocalGameGalaxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure dev branch exists on origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --heads origin dev | grep -q 'refs/heads/dev'; then
            echo "Branch 'dev' does not exist on origin. Creating 'dev' from 'main'..."
            git fetch origin main
            git push origin origin/main:refs/heads/dev
          else
            echo "Branch 'dev' already exists on origin."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve RepoLens Lens & Assemble Prompt
        id: resolver
        run: |
          DOMAIN="${{ inputs.domain || 'architecture' }}"
          LENS="${{ inputs.lens }}"
          REPO="${{ inputs.repolens_repo || 'TheMorpheus407/RepoLens' }}"
          BRANCH="${{ inputs.repolens_branch || 'master' }}"
          MODE="${{ inputs.mode || 'fix' }}"

          ARGS="--domain $DOMAIN --repo $REPO --branch $BRANCH --mode $MODE"
          if [ -n "$LENS" ]; then
            ARGS="$ARGS --lens $LENS"
          fi

          node scripts/jules-lens-resolver.mjs $ARGS

      - name: Create Issue for Plan Mode
        if: inputs.mode == 'plan'
        uses: actions/github-script@v7
        with:
          script: |
            const lensId = "${{ steps.resolver.outputs.lens_id }}";
            const lensName = "${{ steps.resolver.outputs.lens_name }}";
            const domain = "${{ steps.resolver.outputs.domain }}";

            const body = `## 🔍 RepoLens Audit Request: ${lensName} (${domain}/${lensId})

A RepoLens audit has been triggered for domain **${domain}** using lens **${lensId}**.

### 🚦 Next Steps:
- To instruct Jules to plan and fix this audit finding on \`dev\`:
  Reply with comment: **\`/jules approve\`** or assign label **\`jules:approved\`**.
- To run another lens:
  Trigger the **Jules RepoLens Audit Suite** workflow or comment **\`/jules lens <lens-id>\`**.
`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[RepoLens Audit] ${lensName} (${domain}/${lensId})`,
              body: body,
              labels: ['repolens', 'jules:waiting-approval']
            });

            console.log(`Created audit issue #${issue.data.number}`);

      - name: Invoke Google Jules Agent (Fix Mode)
        id: jules_call
        if: inputs.mode != 'plan'
        env:
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STARTING_BRANCH: 'dev'
          REPO: ${{ github.repository }}
          USER_PROMPT: ${{ steps.resolver.outputs.prompt }}
        shell: bash
        run: |
          # 1. Collect all available Jules API keys from secrets
          declare -a KEYS=()
          declare -a KEY_NAMES=()

          if [ -n "$JULES_API_KEY_1" ]; then KEYS+=("$JULES_API_KEY_1"); KEY_NAMES+=("JULES_API_KEY_1"); fi
          if [ -n "$JULES_API_KEY_2" ]; then KEYS+=("$JULES_API_KEY_2"); KEY_NAMES+=("JULES_API_KEY_2"); fi
          if [ -n "$JULES_API_KEY_3" ]; then KEYS+=("$JULES_API_KEY_3"); KEY_NAMES+=("JULES_API_KEY_3"); fi
          if [ -n "$JULES_API_KEY_4" ]; then KEYS+=("$JULES_API_KEY_4"); KEY_NAMES+=("JULES_API_KEY_4"); fi
          if [ -n "$JULES_API_KEY_5" ]; then KEYS+=("$JULES_API_KEY_5"); KEY_NAMES+=("JULES_API_KEY_5"); fi

          # Fallback to JULES_API_KEY if none of the numbered keys exist
          if [ ${#KEYS[@]} -eq 0 ] && [ -n "$JULES_API_KEY" ]; then
            KEYS+=("$JULES_API_KEY")
            KEY_NAMES+=("JULES_API_KEY")
          fi

          TOTAL_KEYS=${#KEYS[@]}
          if [ "$TOTAL_KEYS" -eq 0 ]; then
            echo "::error::No Jules API key secrets configured in GitHub repository secrets!"
            exit 1
          fi

          echo "Found $TOTAL_KEYS Jules API key(s) in pool: ${KEY_NAMES[*]}"

          echo "$USER_PROMPT" > prompt.txt

          jq -n \
            --rawfile jules_prompt prompt.txt \
            --arg starting_branch "$STARTING_BRANCH" \
            --arg repo_full_name "$REPO" \
            '{
              "prompt": $jules_prompt,
              "sourceContext": {
                "source": "sources/github/\($repo_full_name)",
                "githubRepoContext": {
                  "startingBranch": $starting_branch
                }
              },
              "requirePlanApproval": false,
              "automationMode": "AUTO_CREATE_PR"
            }' > jules_payload.json

          INVOKED_SUCCESS=false
          LAST_ERROR=""

          for (( i=0; i<TOTAL_KEYS; i++ )); do
            CURRENT_KEY="${KEYS[$i]}"
            CURRENT_NAME="${KEY_NAMES[$i]}"

            echo "▶ Trying Jules API with secret: $CURRENT_NAME (Slot $i)..."

            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: $CURRENT_KEY" \
              -d @jules_payload.json)

            BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
            STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | cut -d':' -f2)

            echo "Jules API response status: $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              SESSION_ID=$(echo "$BODY" | jq -r '.id // .name // empty' | awk -F'/' '{print $NF}')
              echo "Session started: https://jules.google.com/task/$SESSION_ID via $CURRENT_NAME"
              echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
              echo "session_url=https://jules.google.com/task/$SESSION_ID" >> $GITHUB_OUTPUT
              INVOKED_SUCCESS=true
              break
            else
              echo "⚠️ Key $CURRENT_NAME failed with status $STATUS: $BODY"
              LAST_ERROR="[$CURRENT_NAME, status $STATUS]: $BODY"
            fi
          done

          if [ "$INVOKED_SUCCESS" != "true" ]; then
            echo "::error::All Jules API keys in pool failed! Last error: $LAST_ERROR"
            exit 1
          fi
