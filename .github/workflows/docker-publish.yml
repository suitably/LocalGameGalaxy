name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch: # Ermöglicht das manuelle Starten des Workflows

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache,mode=max
