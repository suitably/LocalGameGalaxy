name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '!server/cloudflare-push-relay/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-server:
    name: Test Server Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Run Tests
        working-directory: ./server
        run: npm test

  check-secrets:
    name: Check Docker Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - name: Check Docker Hub Credentials
        id: check
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured. Skipping Docker image build and push."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: [test-server, check-secrets]
    if: github.repository == 'suitably/LocalGameGalaxy' && needs.check-secrets.outputs.has_creds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Metadata for Base Image
      - name: Extract Docker metadata (Base Image)
        id: meta_base
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=base
            type=sha,prefix=sha-

      # 1. Build & Push Lightweight Base Image (~200MB)
      - name: Build and Push Base Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          target: base
          push: true
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-base
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-base,mode=max

      # Docker Metadata for Full Image
      - name: Extract Docker metadata (Full Image)
        id: meta_full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server
          flavor: |
            suffix=-full
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=full
            type=sha,prefix=sha-

      # 2. Build & Push Full Image with PyTorch & AI Vocal Separation (~2GB)
      - name: Build and Push Full Image (Melodiq AI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          target: full
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-full
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-full,mode=max
