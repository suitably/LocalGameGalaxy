name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual workflow triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Lightweight Base Image (~200MB) -> :latest, :base
      - name: Build and Push Base Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          target: base
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:base
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-base
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-base,mode=max

      # 2. Build & Push Full Image with PyTorch & AI Vocal Separation (~2GB) -> :full, :melodiq
      - name: Build and Push Full Image (Melodiq AI)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          target: full
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:full
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:melodiq
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-full
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:buildcache-full,mode=max
