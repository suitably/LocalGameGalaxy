name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '!server/cloudflare-push-relay/**'
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual workflow triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub Credentials
        id: check_docker_creds
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured. Skipping Docker image build and push."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.check_docker_creds.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check_docker_creds.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_docker_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Lightweight Base Image (~200MB) -> :latest, :base
      - name: Build and Push Base Image
        if: steps.check_docker_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          target: base
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:base
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:base
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache-base
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache-base,mode=max

      # 2. Build & Push Full Image with PyTorch & AI Vocal Separation (~2GB) -> :full, :ai, :melodiq
      - name: Build and Push Full Image (Melodiq AI)
        if: steps.check_docker_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          target: full
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:ai
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:full
            ${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:melodiq
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:full
            ${{ secrets.DOCKERHUB_USERNAME }}/nexumia-server:melodiq
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache-full
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/melodiq-server:buildcache-full,mode=max
