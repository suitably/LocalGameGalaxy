name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '!server/cloudflare-push-relay/**'
      - 'signaling/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-server:
    name: Test Server Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Run Tests
        working-directory: ./server
        run: npm test

  check-secrets:
    name: Check Docker Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - name: Check Docker Hub Credentials
        id: check
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            # the main repository must publish (#590); forks skip
            if [ "$GITHUB_REPOSITORY" = "suitably/LocalGameGalaxy" ]; then
              echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured in suitably/LocalGameGalaxy."
              exit 1
            fi
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured. Skipping Docker image build and push."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: [test-server, check-secrets]
    if: github.repository == 'suitably/LocalGameGalaxy' && needs.check-secrets.outputs.has_creds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Metadata for Base Image
      # Image names are fixed to the nexumia namespace that compose files and docs pull from;
      # the same tags also go to GHCR (ghcr.io/suitably/…) (#592).
      # nexumia/melodiq-server (deprecated alias) is no longer published from 1.2.0 (Q17).
      - name: Extract Docker metadata (Base Image)
        id: meta_base
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            nexumia/nexumia-server
            ghcr.io/suitably/nexumia-server
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=base
            type=sha,prefix=sha-

      # 1. Build & Push Lightweight Base Image (~200MB)
      - name: Build and Push Base Image
        id: build_base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          target: base
          push: true
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=registry,ref=nexumia/nexumia-server:buildcache-base
          cache-to: type=registry,ref=nexumia/nexumia-server:buildcache-base,mode=max

      - name: Attest Base Image (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/nexumia/nexumia-server
          subject-digest: ${{ steps.build_base.outputs.digest }}
          push-to-registry: true

      - name: Attest Base Image (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/suitably/nexumia-server
          subject-digest: ${{ steps.build_base.outputs.digest }}
          push-to-registry: true

      # Docker Metadata for Full Image
      - name: Extract Docker metadata (Full Image)
        id: meta_full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            nexumia/nexumia-server
            ghcr.io/suitably/nexumia-server
          flavor: |
            suffix=-full
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=full
            type=sha,prefix=sha-

      # 2. Build & Push Full Image with PyTorch & AI Vocal Separation (~2GB)
      - name: Build and Push Full Image (AI)
        id: build_full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          target: full
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          cache-from: type=registry,ref=nexumia/nexumia-server:buildcache-full
          cache-to: type=registry,ref=nexumia/nexumia-server:buildcache-full,mode=max

      - name: Attest Full Image (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/nexumia/nexumia-server
          subject-digest: ${{ steps.build_full.outputs.digest }}
          push-to-registry: true

      - name: Attest Full Image (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/suitably/nexumia-server
          subject-digest: ${{ steps.build_full.outputs.digest }}
          push-to-registry: true

  # WebRTC signaling tracker (signaling/), pushed to nexumia/galaxy-signaling = image used by the compose files (keep names in sync)
  build-and-push-signaling:
    name: Build & Push Signaling Image
    needs: check-secrets
    if: github.repository == 'suitably/LocalGameGalaxy' && needs.check-secrets.outputs.has_creds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Signaling)
        id: meta_signaling
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            nexumia/galaxy-signaling
            ghcr.io/suitably/galaxy-signaling
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and Push Signaling Image
        id: build_signaling
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./signaling
          file: ./signaling/Dockerfile
          push: true
          tags: ${{ steps.meta_signaling.outputs.tags }}
          labels: ${{ steps.meta_signaling.outputs.labels }}
          cache-from: type=registry,ref=nexumia/galaxy-signaling:buildcache
          cache-to: type=registry,ref=nexumia/galaxy-signaling:buildcache,mode=max

      - name: Attest Signaling Image (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/nexumia/galaxy-signaling
          subject-digest: ${{ steps.build_signaling.outputs.digest }}
          push-to-registry: true

      - name: Attest Signaling Image (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/suitably/galaxy-signaling
          subject-digest: ${{ steps.build_signaling.outputs.digest }}
          push-to-registry: true
