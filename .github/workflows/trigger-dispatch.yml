name: Trigger Dispatch
on:
  push:
    branches:
      - main
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Jules Pipeline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'jules-pipeline.yml',
              ref: 'main',
              inputs: {
                issue_number: '196',
                action: 'fix'
              }
            });
