name: Jules Status Watcher

on:
  schedule:
    - cron: '*/5 * * * *' # Polls every 5 minutes for active Jules questions & plans
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number to poll (e.g. 230, optional)'
        required: false
        type: string

concurrency:
  group: jules-watcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  poll-sessions:
    name: Poll Active Jules Sessions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Status Watcher
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          JULES_API_KEY_1: ${{ secrets.JULES_API_KEY_1 }}
          JULES_API_KEY_2: ${{ secrets.JULES_API_KEY_2 }}
          JULES_API_KEY_3: ${{ secrets.JULES_API_KEY_3 }}
          JULES_API_KEY_4: ${{ secrets.JULES_API_KEY_4 }}
          JULES_API_KEY_5: ${{ secrets.JULES_API_KEY_5 }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          script: |
            const watcher = require('./scripts/pipeline/jules-watcher.cjs');
            await watcher({ github, context, core });
