name: Release Nexumia Server

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Nexumia Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Binaries (pkg)
        working-directory: ./server
        run: npm run package

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release/linux release/windows release/macos
          
          # Linux
          cp server/dist/nexumia-server-linux release/linux/
          cp server/release-scripts/start-server.sh release/linux/
          cp server/release-scripts/NexumiaServer.desktop release/linux/
          chmod +x release/linux/nexumia-server-linux release/linux/start-server.sh
          
          # Windows
          cp server/dist/nexumia-server-win.exe release/windows/
          cp server/release-scripts/start-server.bat release/windows/
          
          # macOS
          cp server/dist/nexumia-server-macos release/macos/
          cp server/release-scripts/start-server.command release/macos/
          chmod +x release/macos/nexumia-server-macos release/macos/start-server.command

      - name: Create Archives
        run: |
          cd release/linux && tar -czf ../../nexumia-server-linux.tar.gz * && cd ../..
          cd release/windows && zip -r ../../nexumia-server-win.zip * && cd ../..
          cd release/macos && tar -czf ../../nexumia-server-macos.tar.gz * && cd ../..

      - name: Attach Server Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexumia-server-linux.tar.gz
            nexumia-server-macos.tar.gz
            nexumia-server-win.zip
