name: Release Melodiq Helper

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Binaries (pkg)
        working-directory: ./server
        run: npm run package

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release/linux release/windows release/macos
          
          # Linux
          cp server/dist/melodiq-server-linux release/linux/
          cp server/release-scripts/start-server.sh release/linux/
          cp server/release-scripts/MelodiqServer.desktop release/linux/
          chmod +x release/linux/melodiq-server-linux release/linux/start-server.sh
          
          # Windows
          cp server/dist/melodiq-server-win.exe release/windows/
          cp server/release-scripts/start-server.bat release/windows/
          
          # macOS
          cp server/dist/melodiq-server-macos release/macos/
          cp server/release-scripts/start-server.command release/macos/
          chmod +x release/macos/melodiq-server-macos release/macos/start-server.command

      - name: Create Archives
        run: |
          cd release/linux && tar -czf ../../melodiq-server-linux.tar.gz * && cd ../..
          cd release/windows && zip -r ../../melodiq-server-win.zip * && cd ../..
          cd release/macos && tar -czf ../../melodiq-server-macos.tar.gz * && cd ../..

      - name: Attach Server Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            melodiq-server-linux.tar.gz
            melodiq-server-macos.tar.gz
            melodiq-server-win.zip
