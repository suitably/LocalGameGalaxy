name: Deploy Cloudflare Push Relay

on:
  push:
    branches:
      - main
    paths:
      - 'server/cloudflare-push-relay/**'
      - 'tools/wrangler/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check Cloudflare Token
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            # the main repository must publish (#590); forks skip
            if [ "$GITHUB_REPOSITORY" = "suitably/LocalGameGalaxy" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN secret is not configured in suitably/LocalGameGalaxy."
              exit 1
            fi
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not configured in repository secrets. Skipping automated deployment."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check-secrets
    if: needs.check-secrets.outputs.has_token == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned wrangler version
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          workingDirectory: 'server/cloudflare-push-relay'
