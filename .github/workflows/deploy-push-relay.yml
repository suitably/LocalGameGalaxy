name: Deploy Cloudflare Push Relay

on:
  push:
    branches:
      - main
    paths:
      - 'server/cloudflare-push-relay/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Check Cloudflare Token
        id: check_token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not configured in repository secrets. Skipping automated deployment."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Deploy Worker
        if: steps.check_token.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server/cloudflare-push-relay'
